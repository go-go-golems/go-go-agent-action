name: "Agent Code Action (Go)"
description: "Go-based GitHub Action that bundles PR context and routes it to your own tool (mock or CLI), then posts the result as a PR review or comment."
branding:
  icon: "zap"
  color: "blue"

inputs:
  trigger_phrase:
    description: "Trigger phrase to look for in comments or PR body (set to empty for always-on)"
    required: false
    default: ""
  label_trigger:
    description: "Optional label that triggers the action on PRs"
    required: false
    default: ""
  assignee_trigger:
    description: "Optional assignee username that triggers the action"
    required: false
    default: ""
  pr_number:
    description: "Manual PR number override (useful for workflow_dispatch)"
    required: false
    default: ""
  guidelines_path:
    description: "Path to a repo file with review guidelines (compatible with CLAUDE.md)"
    required: false
    default: "CLAUDE.md"
  include_patch:
    description: "Include unified diff (patch) for each changed file"
    required: false
    default: "true"
  include_file_contents:
    description: "Include full file contents for changed files (respecting max_file_bytes)"
    required: false
    default: "false"
  include_repo_globs:
    description: "Comma-separated globs to include extra repo files in context (e.g. docs/**/*.md,.github/*.md)"
    required: false
    default: ""
  prompt_template_path:
    description: "Optional repo path to a prompt template file"
    required: false
    default: ""
  prompt_template_engine:
    description: "Template engine to use (go-template)"
    required: false
    default: "go-template"
  prompt_template_vars_json:
    description: "Optional JSON object of variables for prompt template rendering"
    required: false
    default: "{}"
  prompt_template_max_bytes:
    description: "Max bytes to read from the prompt template file"
    required: false
    default: "200000"
  include_diary:
    description: "Ask the tool to return a structured diary in the ReviewResult"
    required: false
    default: "false"
  max_file_bytes:
    description: "Max bytes per file to include when include_file_contents=true"
    required: false
    default: "200000"
  max_changed_files:
    description: "Cap the number of PR changed files collected"
    required: false
    default: "200"

  tool_mode:
    description: "How to call your tool: mock | cmd"
    required: false
    default: "mock"

  tool_cmd:
    description: "When tool_mode=cmd, the command (binary) to execute"
    required: false
    default: ""
  tool_args_json:
    description: "When tool_mode=cmd, JSON array of args for the command"
    required: false
    default: "[]"
  working_directory:
    description: "Working directory for CLI tool (defaults to workspace)"
    required: false
    default: ""

  output_mode:
    description: "Where to post results: review | comment | summary | stdout | diary | review+summary"
    required: false
    default: "review+summary"
  max_comments:
    description: "Max inline comments to post (review mode)"
    required: false
    default: "30"

  github_token:
    description: "GitHub token; defaults to GITHUB_TOKEN"
    required: false
    default: ""
  debug_github_api:
    description: "Log GitHub API calls to stderr for debugging"
    required: false
    default: "false"
  dry_run:
    description: "Skip publishing to GitHub (print summaries only)"
    required: false
    default: "false"

runs:
  using: "docker"
  image: "docker://ghcr.io/go-go-golems/go-go-agent-action:main"
  args:
    - "--trigger_phrase"
    - "${{ inputs.trigger_phrase }}"
    - "--label_trigger"
    - "${{ inputs.label_trigger }}"
    - "--assignee_trigger"
    - "${{ inputs.assignee_trigger }}"
    - "--pr_number"
    - "${{ inputs.pr_number }}"
    - "--guidelines_path"
    - "${{ inputs.guidelines_path }}"
    - "--include_patch"
    - "${{ inputs.include_patch }}"
    - "--include_file_contents"
    - "${{ inputs.include_file_contents }}"
    - "--include_repo_globs"
    - "${{ inputs.include_repo_globs }}"
    - "--prompt_template_path"
    - "${{ inputs.prompt_template_path }}"
    - "--prompt_template_engine"
    - "${{ inputs.prompt_template_engine }}"
    - "--prompt_template_vars_json"
    - "${{ inputs.prompt_template_vars_json }}"
    - "--prompt_template_max_bytes"
    - "${{ inputs.prompt_template_max_bytes }}"
    - "--include_diary"
    - "${{ inputs.include_diary }}"
    - "--max_file_bytes"
    - "${{ inputs.max_file_bytes }}"
    - "--max_changed_files"
    - "${{ inputs.max_changed_files }}"
    - "--tool_mode"
    - "${{ inputs.tool_mode }}"
    - "--tool_cmd"
    - "${{ inputs.tool_cmd }}"
    - "--tool_args_json"
    - "${{ inputs.tool_args_json }}"
    - "--working_directory"
    - "${{ inputs.working_directory }}"
    - "--output_mode"
    - "${{ inputs.output_mode }}"
    - "--max_comments"
    - "${{ inputs.max_comments }}"
    - "--github_token"
    - "${{ inputs.github_token }}"
    - "--debug_github_api"
    - "${{ inputs.debug_github_api }}"
    - "--dry_run"
    - "${{ inputs.dry_run }}"
